olist:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'warehouse-db') }}"
      port: 5432
      user: "{{ env_var('DBT_USER', 'warehouse') }}"
      password: "{{ env_var('DBT_PASSWORD', 'warehouse') }}"
      dbname: olist_dw
      schema: public
      threads: 4