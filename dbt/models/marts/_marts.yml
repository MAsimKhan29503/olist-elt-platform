version: 2

models:
  - name: dim_customers
    description: "One row per real customer (customer_unique_id). Location is from the most recent order."
    columns:
      - name: customer_key
        data_tests: [unique, not_null]

  - name: dim_products
    description: "One row per product, with the English category name."
    columns:
      - name: product_key
        data_tests: [unique, not_null]
      - name: category_name_en
        data_tests: [not_null]

  - name: dim_sellers
    description: "One row per seller."
    columns:
      - name: seller_key
        data_tests: [unique, not_null]

  - name: dim_date
    description: "One row per calendar day from 2016 to 2018."
    columns:
      - name: date_day
        data_tests: [unique, not_null]


  - name: fct_order_items
    description: "Fact table. One row per item in an order, with keys to the dimensions and prices in BRL and USD."
    columns:
      - name: order_item_key
        data_tests: [unique, not_null]
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_key
      - name: product_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_key
      - name: seller_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_key
      - name: purchase_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day