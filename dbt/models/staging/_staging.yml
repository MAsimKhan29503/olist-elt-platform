version: 2

models:
  - name: stg_orders
    description: "One row per order, cleaned and renamed."
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: [delivered, shipped, canceled, unavailable, invoiced, processing, created, approved]
      - name: purchased_at
        data_tests: [not_null]

  - name: stg_customers
    description: "One row per customer_id (one per order, as in the source data)."
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_unique_id
        data_tests: [not_null]

  - name: stg_order_items
    description: "One row per item in an order."
    columns:
      - name: order_item_key
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: seller_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_sellers')
                field: seller_id

  - name: stg_order_payments
    description: "One row per payment of an order."
    columns:
      - name: payment_key
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: payment_type
        data_tests:
          - accepted_values:
              arguments:
                values: [credit_card, boleto, voucher, debit_card, not_defined]

  - name: stg_order_reviews
    description: "One row per review of an order. review_id alone is not unique, so the key is review_id plus order_id."
    columns:
      - name: review_key
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: review_score
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]

  - name: stg_products
    description: "One row per product."
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: stg_sellers
    description: "One row per seller."
    columns:
      - name: seller_id
        data_tests: [unique, not_null]

  - name: stg_fx_rates
    description: "Daily BRL to USD exchange rate."
    columns:
      - name: rate_date
        data_tests: [not_null]
      - name: exchange_rate
        data_tests: [not_null]