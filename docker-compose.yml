x-airflow-common: &airflow-common
  build: .
  image: olist-airflow:latest
  user: "50000:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: dev-only-change-me
    AIRFLOW_CONN_SOURCE_PG: postgresql://source:source@source-db:5432/olist_source
    AIRFLOW_CONN_WAREHOUSE_PG: postgresql://warehouse:warehouse@warehouse-db:5432/olist_dw
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/logs:/opt/airflow/logs
    - ./data/vendor_drop:/opt/airflow/data/vendor_drop
  depends_on:
    airflow-db:
      condition: service_healthy

services:
  source-db:
    image: postgres:16
    environment:
      POSTGRES_USER: source
      POSTGRES_PASSWORD: source
      POSTGRES_DB: olist_source
    ports:
      - "5433:5432"
    volumes:
      - source_data:/var/lib/postgresql/data
      - ./source_db/init:/docker-entrypoint-initdb.d:ro
      - ./data/olist:/data/olist:ro

  warehouse-db:
    image: postgres:16
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
      POSTGRES_DB: olist_dw
    ports:
      - "5434:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
      - ./warehouse_db/init:/docker-entrypoint-initdb.d:ro

  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_meta:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  source_data:
  warehouse_data:
  airflow_meta: 